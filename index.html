<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0d12">
  <title>Charsheet Selection</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="landing-body">
  <div class="landing-background-layer" id="landingBackground" aria-hidden="true"></div>
  <div class="landing-aurora" aria-hidden="true">
    <div class="landing-glow landing-glow-one"></div>
    <div class="landing-glow landing-glow-two"></div>
    <div class="landing-grain"></div>
  </div>
  <div class="landing-shell">
    <header class="landing-hero">
      <h1>Wähle eine Geschichte.</h1>
    </header>
    <main>
      <section class="card-grid" id="characterGrid" aria-label="Charakterauswahl"></section>
      <section class="fallback-list" id="characterFallback" aria-label="Charakterauswahl als Linkliste">
        <a class="fallback-card" href="characters/aeva.html">
          <span class="fallback-name">Aeva</span>
          <span class="fallback-detail">Wächterin an der Schwelle</span>
        </a>
        <a class="fallback-card" href="characters/astrea.html">
          <span class="fallback-name">Astrea</span>
          <span class="fallback-detail">Zwischen Herkunft und Aufbruch</span>
        </a>
        <a class="fallback-card" href="characters/beatrix.html">
          <span class="fallback-name">Beatrix</span>
          <span class="fallback-detail">Zwischen Lehre und Fluch</span>
        </a>
        <a class="fallback-card" href="characters/tezanji.html">
          <span class="fallback-name">Tezanji</span>
          <span class="fallback-detail">Zu wild für eure Mauern</span>
        </a>
        <a class="fallback-card" href="characters/demetria.html">
          <span class="fallback-name">Demetria</span>
          <span class="fallback-detail">Das Rascheln im Laub</span>
        </a>
      </section>
      <noscript>
        <p class="fallback-hint">JavaScript ist deaktiviert. Die Geschichten bleiben über die Linkliste erreichbar.</p>
      </noscript>
    </main>
  </div>
  <script src="js/data/characters/aeva.js"></script>
  <script src="js/data/characters/astrea.js"></script>
  <script src="js/data/characters/beatrix.js"></script>
  <script src="js/data/characters/brixxli.js"></script>
  <script src="js/data/characters/tezanji.js"></script>
  <script src="js/data/characters/demetria.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/landing.js"></script>
</body>
</html>
